# Used by Services/CavaService.qml: raw ASCII frames, one line per frame,
# bar values 0-100 separated by ';'.
[general]
framerate = 30
bars = 24
autosens = 1

[input]
# pulse (via pipewire-pulse) with source=auto captures the default output's
# monitor; cava's pipewire method picked up the microphone instead.
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 77
