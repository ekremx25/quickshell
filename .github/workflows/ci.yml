name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate configuration
    runs-on: ubuntu-latest
    container: archlinux:base

    steps:
      - name: Install test runtime
        run: pacman -Syu --noconfirm --needed git base-devel python nodejs quickshell qt6-declarative ttf-dejavu dbus curl jq inotify-tools socat

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Run all Python and isolated QML tests (no silent skips)
        run: dbus-run-session -- python tests/run_ci.py

      - name: Run JavaScript tests
        shell: bash
        run: |
          set -euo pipefail
          for file in tests/test_*.js; do node "$file"; done

      - name: Compile Python helpers
        run: |
          python -m compileall -q scripts Modules tests

      - name: Build Activity Monitor sampler
        shell: bash
        run: |
          set -euo pipefail
          make -C Modules/bar/ActivityMonitor -B
          test "$(Modules/bar/ActivityMonitor/activity-sampler --version)" = "activity-sampler 2.1.1"
          Modules/bar/ActivityMonitor/activity-sampler --activity-resources | awk 'NR == 1 {ok = ($0 == "schema\tactivity-resources\t1")} END {exit !ok}'

      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do bash -n "$file"; done < <(git ls-files -z '*.sh')

      - name: Validate tracked JSON
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            python -m json.tool "$file" >/dev/null
          done < <(git ls-files '*.json')

      - name: Reject user-specific runtime files
        shell: bash
        run: |
          set -euo pipefail
          forbidden=(
            monitor_config.json
            monitor_identities.json
            monitor_role_profiles.json
            monitor_runtime.json
            screen_config.json
            desktop_widgets.json
            weather_config.json
          )
          for file in "${forbidden[@]}"; do
            if git ls-files --error-unmatch "$file" >/dev/null 2>&1; then
              echo "User-specific runtime file is tracked: $file" >&2
              exit 1
            fi
          done
